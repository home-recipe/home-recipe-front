<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="home_recipe_front">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>home_recipe_front</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* 로딩 화면 스타일 */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #FFFBF0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.3s ease-out;
    }

    #loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      width: 50px;
      height: 50px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #FFA726;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      color: #666;
    }
  </style>
</head>
<body>
  <!-- 로딩 화면 -->
  <div id="loading">
    <div class="loader"></div>
    <p class="loading-text">로딩 중...</p>
  </div>

  <script>
    // 서버에서 토큰이 담긴 URL로 리다이렉트시켰을 때, Flutter 엔진이 초기화되면서 URL을 덮어쓰거나 유실하는 상황을 방지
    // OAuth 콜백: Flutter 로드 전 URL 보존 (서버 리다이렉트 시에도 참고용)
    window.__INITIAL_PATH = window.location.pathname;
    window.__INITIAL_HREF = window.location.href;

    // 로딩 화면 제거 함수 - Flutter에서 호출
    // 플러터 앱이 실행 완료된 시점에 Dart코드에서 이 JS 함수 호출하여 로딩창 지움
    window.removeLoadingScreen = function() {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('fade-out');
        setTimeout(function() {
          loading.remove();
        }, 300);
      }
    };

    // 안전장치: 최대 10초 후 강제 제거 (폰트 로드 실패 시에도 앱 사용 가능하도록)
    window._loadingTimeout = setTimeout(function() {
      window.removeLoadingScreen();
    }, 10000);

    {{flutter_js}}
    {{flutter_build_config}}


    // 웹 환경에서도 앱과 같은 부드러운 그래픽을 제공하기 위한 설정
    // Flutter 앱 초기화
    // CanvasKit 렌더링 강제 지정
    _flutter.loader.load({
      onEntrypointLoaded: async function(engineInitializer) {
        // CanvasKit 엔진 초기화
        const appRunner = await engineInitializer.initializeEngine({
          renderer: "canvaskit",
        });

        // 앱 실행
        await appRunner.runApp();

        // Flutter 앱에서 폰트 로드 완료 후 removeLoadingScreen() 호출함
        // 여기서는 추가 작업 불필요
      }
    });
  </script>
</body>
</html>
