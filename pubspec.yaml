name: home_recipe_front
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

 
 # 외부 라이브러리
  cupertino_icons: ^1.0.8
  http: ^0.13.6
  shared_preferences: ^2.2.2
  video_player: ^2.8.2
  image_picker: ^1.0.7
  flutter_secure_storage: ^9.0.0
  url_launcher: ^6.2.1
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/profiles/
    - assets/videos/
    - assets/logos/

  fonts:
    - family: DoHyeon
      fonts:
        - asset: assets/fonts/DoHyeon-Regular.ttf

    - family: Cafe24Danjunghae
      fonts:
        - asset: assets/fonts/Cafe24Danjunghae-v2.0.ttf

    - family: Cafe24PROSlimFit
      fonts:
        - asset: assets/fonts/Cafe24PROSlimFit.ttf

    - family: GowunBatang
      fonts:
        - asset: assets/fonts/GowunBatang-Regular.ttf
          weight: 400
        - asset: assets/fonts/GowunBatang-Bold.ttf
          weight: 700

    - family: Jua
      fonts:
        - asset: assets/fonts/Jua-Regular.ttf

    - family: NanumBrushScript
      fonts:
        - asset: assets/fonts/NanumBrushScript-Regular.ttf

    - family: NanumMyeongjo
      fonts:
        - asset: assets/fonts/NanumMyeongjo-Regular.ttf
          weight: 400
        - asset: assets/fonts/NanumMyeongjo-Bold.ttf
          weight: 700
        - asset: assets/fonts/NanumMyeongjo-ExtraBold.ttf
          weight: 800

    - family: NanumGothicCoding-Regular
      fonts:
        - asset: assets/fonts/NanumGothicCoding-Regular.ttf